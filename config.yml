    tag: tags

menu:
    main:
        - name: Papers
          url: /papers/
          weight: 2
        - name: CV
          url: /cv/
          weight: 3
        - name: Blog Posts
          url: /blog/
          weight: 4

params:
    description: "I am an economist at the Federal Reserve Board. My research focuses on macroeconomics, monetary policy, and labor markets."
    author: Finn Schüle
    googleAnalyticsID: "G-V4CLT31NFQ"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","cv","blog-posts"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Finn Schüle
          subtitle: "I am an economist in the Trade and Financial Studies Section of the Division of International Finance at the Federal Reserve Board. I am a macroeconomist focusing on **monetary policy**, **production networks**, and **labor markets**. I received my Ph.D. from Brown University. Before starting graduate school, I worked on monetary policy and public finance as a research assistant at the Brookings Institution, received an M.Sc. in Economics from the University of Warwick, and a B.A. in History and Economics from the University of Oxford."
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Curriculum Vitae
              url: Finn_Schuele_CV.pdf
            - name: Papers
              url: /papers/
            - name: Blog Posts
              url: /blog/

    socialIcons:
        - name: CV
          url: Finn_Schuele_CV.pdf
        - name: Email
          url: mailto:finn.d.schuele@frb.gov
        - name: GitHub
          url: https://github.com/finnschule
        #- name: Twitter
        #  url: https://x.com/FinnSchule

